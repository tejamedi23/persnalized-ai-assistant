<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 2: Clean Bento Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
        }

        .bento-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            transition: transform 0.2s;
        }

        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        }

        .btn-primary {
            background-color: #1d4ed8;
            color: white;
            border-radius: 12px;
        }
    </style>
</head>

<body class="h-screen flex p-4 gap-4 bg-gray-100">

    <!-- Sidebar -->
    <aside class="w-20 bg-white rounded-[32px] flex flex-col items-center py-8 gap-6 shadow-sm">
        <div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center font-bold text-white mb-4">AI
        </div>
        <button class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">📅</button>
        <button class="w-10 h-10 text-gray-400 hover:bg-gray-50 rounded-xl flex items-center justify-center">✉️</button>
        <button class="w-10 h-10 text-gray-400 hover:bg-gray-50 rounded-xl flex items-center justify-center">✈️</button>
        <button class="w-10 h-10 bg-gray-800 text-white rounded-xl flex items-center justify-center mt-auto">🤖</button>
    </aside>

    <!-- Main Grid -->
    <main class="flex-1 grid grid-cols-4 grid-rows-2 gap-4">

        <!-- Header / Welcome -->
        <div
            class="col-span-3 bento-card p-8 flex items-center justify-between bg-gradient-to-r from-blue-600 to-blue-500 text-white">
            <div>
                <h1 class="text-3xl font-bold mb-2">Hello, Teja!</h1>
                <p class="opacity-90">You have 3 meetings and 5 unread emails today.</p>
            </div>
            <button class="bg-white text-blue-600 px-6 py-3 rounded-xl font-bold">Check Schedule</button>
        </div>

        <!-- Weather / Date -->
        <div class="col-span-1 bento-card p-6 flex flex-col justify-between bg-yellow-400 text-gray-900">
            <div class="text-4xl font-bold">25</div>
            <div class="font-medium">Sunday, Jan<br>Bengaluru, IN</div>
        </div>

        <!-- Main Content Area (Schedule) -->
        <div class="col-span-2 row-span-2 bento-card p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Upcoming</h2>
                <button class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">+</button>
            </div>
            <div class="space-y-3">
                <div class="p-4 rounded-2xl bg-blue-50 border-l-4 border-blue-500">
                    <div class="font-bold text-gray-800">Product Review</div>
                    <div class="text-sm text-gray-500">10:00 AM • 1h</div>
                </div>
                <div class="p-4 rounded-2xl bg-gray-50 border-l-4 border-gray-300">
                    <div class="font-bold text-gray-800">Lunch Break</div>
                    <div class="text-sm text-gray-500">01:00 PM • 1h</div>
                </div>
                <div class="p-4 rounded-2xl bg-purple-50 border-l-4 border-purple-500">
                    <div class="font-bold text-gray-800">Design Sprint</div>
                    <div class="text-sm text-gray-500">03:00 PM • 2h</div>
                </div>
            </div>
        </div>

        <!-- Mail Widget -->
        <div class="col-span-1 bento-card p-6">
            <h2 class="text-lg font-bold mb-4">Inbox (5)</h2>
            <div class="space-y-4">
                <div class="flex gap-3 items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-200"></div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold truncate">Sarah Miller</div>
                        <div class="text-xs text-gray-500 truncate">Q3 Strategy Update...</div>
                    </div>
                </div>
                <div class="flex gap-3 items-center">
                    <div class="w-8 h-8 rounded-full bg-gray-200"></div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold truncate">HR Team</div>
                        <div class="text-xs text-gray-500 truncate">Holiday Schedule...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Quick Action -->
        <div class="col-span-1 bento-card p-6 flex flex-col relative overflow-hidden bg-gray-900 text-white">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full blur-[50px] opacity-30"></div>
            <h2 class="text-lg font-bold mb-auto relative">Ask AI</h2>
            <div class="relative">
                <input type="text" placeholder="Type command..."
                    class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 outline-none text-sm placeholder-gray-400">
            </div>
        </div>

    </main>
</body>

</html>
